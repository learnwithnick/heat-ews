services:
  db:
    image: postgis/postgis:16-3.4
    container_name: heat-db
    environment:
      POSTGRES_USER: heat
      POSTGRES_PASSWORD: heat_dev
      POSTGRES_DB: heatews
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heat -d heatews"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: heat-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:

  